<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 560 50'
    style='background-color: #00000000;'
    width='560px' height='50px'>

    <style>
@font-face {
  font-family: 'Noto Sans KR';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h560 ; m0,25 h560 ; m0,25 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Noto Sans KR", monospace' fill='#14B8A6' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            만들고, 배포하고, 운영합니다
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h560 ; m0,25 h560 ; m0,25 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Noto Sans KR", monospace' fill='#14B8A6' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            RPA 900개 과제 단독 운영
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h560 ; m0,25 h560 ; m0,25 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Noto Sans KR", monospace' fill='#14B8A6' font-size='20'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            집 서버 한 대로 서비스 6개 운영
        </textPath>
    </text>
</svg>
